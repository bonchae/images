<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" font-family="'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F9AB00"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>

  <!-- ================= Left icon rail ================= -->
  <rect x="24" y="70" width="64" height="470" rx="14" fill="#F1F3F4"/>
  <!-- generic sidebar icons (gray placeholders) -->
  <g fill="none" stroke="#9AA0A6" stroke-width="2.4" stroke-linecap="round">
    <g transform="translate(56,112)"><line x1="-9" y1="-6" x2="9" y2="-6"/><line x1="-9" y1="0" x2="9" y2="0"/><line x1="-9" y1="6" x2="9" y2="6"/></g>
    <g transform="translate(56,172)"><circle cx="-1" cy="-1" r="7"/><line x1="4.5" y1="4.5" x2="9" y2="9"/></g>
    <g transform="translate(56,232)"><rect x="-8" y="-8" width="16" height="16" rx="2"/><line x1="-8" y1="-2" x2="8" y2="-2"/></g>
  </g>
  <!-- highlighted KEY icon -->
  <rect x="30" y="268" width="52" height="52" rx="12" fill="#FEF7E0" stroke="#F9AB00" stroke-width="2.5"/>
  <g transform="translate(56,294)" stroke="#F9AB00" stroke-width="3.2" fill="none" stroke-linecap="round">
    <circle cx="-6" cy="-4" r="7"/>
    <line x1="-1.5" y1="0.5" x2="10" y2="12"/>
    <line x1="6" y1="8" x2="10.5" y2="3.5"/>
    <line x1="10" y1="12" x2="13" y2="9"/>
  </g>
  <!-- more generic icons below -->
  <g fill="none" stroke="#9AA0A6" stroke-width="2.4" stroke-linecap="round">
    <g transform="translate(56,360)"><path d="M-8,-7 h10 l6,6 v9 a1,1 0 0 1 -1,1 h-15 a1,1 0 0 1 -1,-1 v-14 a1,1 0 0 1 1,-1 z"/></g>
    <g transform="translate(56,420)"><line x1="-8" y1="-8" x2="8" y2="8"/><line x1="8" y1="-8" x2="-8" y2="8"/></g>
    <g transform="translate(56,480)"><circle cx="0" cy="0" r="8"/><line x1="0" y1="-8" x2="0" y2="0"/><line x1="0" y1="0" x2="5" y2="4"/></g>
  </g>
  <!-- caption under the rail -->
  <text x="56" y="575" text-anchor="middle" font-size="17" font-weight="700" fill="#202124">Click the</text>
  <text x="56" y="597" text-anchor="middle" font-size="17" font-weight="700" fill="#202124">key icon</text>

  <!-- flow arrow -->
  <line x1="100" y1="294" x2="180" y2="294" stroke="#F9AB00" stroke-width="6" marker-end="url(#arrow)"/>

  <!-- ================= Secrets panel ================= -->
  <rect x="200" y="70" width="700" height="560" rx="18" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- panel key + title -->
  <g transform="translate(238,118)" stroke="#5F6368" stroke-width="2.6" fill="none" stroke-linecap="round">
    <circle cx="-5" cy="-4" r="6"/><line x1="-1" y1="0" x2="9" y2="10"/><line x1="5" y1="7" x2="9" y2="3"/><line x1="9" y1="10" x2="12" y2="7"/>
  </g>
  <text x="266" y="126" font-size="27" font-weight="700" fill="#202124">Secrets</text>
  <text x="232" y="158" font-size="15.5" fill="#5F6368">Private to you, stored per Google account. A notebook reads a secret only if you allow it.</text>
  <line x1="232" y1="176" x2="868" y2="176" stroke="#E8EAED" stroke-width="1.5"/>

  <!-- Add new secret button -->
  <rect x="232" y="198" width="214" height="46" rx="23" fill="#FFFFFF" stroke="#F9AB00" stroke-width="2"/>
  <g transform="translate(258,221)" stroke="#F9AB00" stroke-width="2.6" stroke-linecap="round"><line x1="-7" y1="0" x2="7" y2="0"/><line x1="0" y1="-7" x2="0" y2="7"/></g>
  <text x="278" y="227" font-size="17.5" font-weight="600" fill="#B06000">Add new secret</text>
  <!-- badge 1 -->
  <circle cx="232" cy="198" r="17" fill="#F9AB00"/><text x="232" y="204" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">1</text>

  <!-- table header -->
  <text x="262" y="300" font-size="13.5" font-weight="700" fill="#5F6368" letter-spacing="0.5">NOTEBOOK ACCESS</text>
  <text x="470" y="300" font-size="13.5" font-weight="700" fill="#5F6368" letter-spacing="0.5">NAME</text>
  <text x="660" y="300" font-size="13.5" font-weight="700" fill="#5F6368" letter-spacing="0.5">VALUE</text>

  <!-- secret row -->
  <rect x="232" y="312" width="636" height="74" rx="12" fill="#F8F9FA" stroke="#E8EAED" stroke-width="1.5"/>
  <!-- toggle ON -->
  <rect x="270" y="336" width="56" height="28" rx="14" fill="#34A853"/>
  <circle cx="312" cy="350" r="11" fill="#FFFFFF"/>
  <text x="298" y="404" text-anchor="middle" font-size="13.5" font-weight="700" fill="#188038">ON</text>
  <!-- badge 4 -->
  <circle cx="266" cy="322" r="17" fill="#F9AB00"/><text x="266" y="328" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">4</text>
  <!-- name field -->
  <rect x="452" y="331" width="176" height="38" rx="8" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.5"/>
  <text x="466" y="356" font-size="16.5" font-family="'Courier New', monospace" font-weight="700" fill="#202124">GEMINI_API_KEY</text>
  <!-- badge 2 -->
  <circle cx="452" cy="322" r="17" fill="#F9AB00"/><text x="452" y="328" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">2</text>
  <!-- value field -->
  <rect x="648" y="331" width="204" height="38" rx="8" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1.5"/>
  <text x="662" y="356" font-size="16.5" font-family="'Courier New', monospace" fill="#5F6368">AIzaSyD&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;</text>
  <!-- badge 3 -->
  <circle cx="648" cy="322" r="17" fill="#F9AB00"/><text x="648" y="328" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">3</text>

  <!-- faint empty row for realism -->
  <rect x="232" y="416" width="636" height="44" rx="10" fill="#FFFFFF" stroke="#EEF0F2" stroke-width="1.5"/>
  <circle cx="298" cy="438" r="9" fill="none" stroke="#DADCE0" stroke-width="1.5"/>
  <line x1="470" y1="438" x2="560" y2="438" stroke="#E8EAED" stroke-width="6" stroke-linecap="round"/>
  <line x1="662" y1="438" x2="760" y2="438" stroke="#E8EAED" stroke-width="6" stroke-linecap="round"/>

  <!-- ================= Legend ================= -->
  <text x="936" y="126" font-size="20" font-weight="700" fill="#202124">Do this:</text>

  <g font-size="16.5" fill="#3C4043">
    <circle cx="952" cy="182" r="17" fill="#F9AB00"/><text x="952" y="188" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">1</text>
    <text x="982" y="180">Click <tspan font-weight="700">Add new</tspan></text>
    <text x="982" y="203"><tspan font-weight="700">secret</tspan>.</text>

    <circle cx="952" cy="262" r="17" fill="#F9AB00"/><text x="952" y="268" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">2</text>
    <text x="982" y="255">Name it exactly</text>
    <text x="982" y="278" font-family="'Courier New', monospace" font-weight="700" fill="#202124">GEMINI_API_KEY</text>
    <text x="982" y="300">(case-sensitive).</text>

    <circle cx="952" cy="360" r="17" fill="#F9AB00"/><text x="952" y="366" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">3</text>
    <text x="982" y="358">Paste your API key</text>
    <text x="982" y="381">as the <tspan font-weight="700">Value</tspan>.</text>

    <circle cx="952" cy="448" r="17" fill="#F9AB00"/><text x="952" y="454" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">4</text>
    <text x="982" y="440">Turn <tspan font-weight="700">Notebook</tspan></text>
    <text x="982" y="463"><tspan font-weight="700">access</tspan> ON.</text>
  </g>
  <!-- most-missed callout -->
  <rect x="936" y="492" width="286" height="86" rx="12" fill="#FEF7E0" stroke="#F9AB00" stroke-width="1.5"/>
  <text x="954" y="520" font-size="15.5" font-weight="700" fill="#B06000">The step most people miss:</text>
  <text x="954" y="544" font-size="15.5" fill="#7A4600">no toggle = the lab can't find</text>
  <text x="954" y="564" font-size="15.5" fill="#7A4600">your key.</text>
</svg>
